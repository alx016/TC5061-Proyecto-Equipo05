[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tc5061_proyecto_equipo5"
version = "0.0.1"
description = "Diseniar, como equipo, una propuesta de solucion de Machine Learning para un conjunto de preguntas sobre el sistema de bicicleta publica MiBici, que combine modelos de regresion, clasificacion y clustering. Y realizar tareas de manipulacion, preparacion, exploracion y preprocesamiento de datos, gestionando grandes volumenes de datos distribuidos y aplicando tecnicas de versionado de datos para asegurar la reproducibilidad y trazabilidad en proyectos de Machine Learning."
authors = [
  { name = "Equipo 5" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "folium==0.20.0",
    "ipython==9.17.1",
    "jupyterlab==4.6.4",
    "lightgbm==4.7.0",
    "loguru==0.7.3",
    "matplotlib==3.11.2",
    "mkdocs==1.6.1",
    "mlflow==3.17.1",
    "notebook==7.6.3",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pip==26.2.1",
    "pyarrow==25.0.1",
    "pytest==9.1.1",
    "python-dotenv==1.2.4",
    "ruff==0.17.0",
    "scikit-learn==1.9.1",
    "seaborn==0.13.2",
    "tqdm==4.70.1",
    "typer==0.27.3",
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["tc5061_proyecto_equipo5"]
include = ["pyproject.toml", "tc5061_proyecto_equipo5/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["tc5061_proyecto_equipo5"]
force-sort-within-sections = true

