name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7" # same uv as the Containerfile

jobs:
  lint-and-security:
    name: Lint and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3 # no major tag (v10) is published
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: lint

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: make lint

      - name: Security (bandit, pip-audit, detect-secrets)
        run: make security

  test-matrix:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: fast
            marker: "not slow"
          - suite: slow
            marker: "slow"
    steps:
      - uses: actions/checkout@v7

      # The cache also keeps the DeepChecks environment that scripts/data_checks.py builds
      # with Python 3.12, so tests/test_data_checks.py does not reinstall it on every run.
      - uses: astral-sh/setup-uv@v10.3.3 # no major tag (v10) is published
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-python: true
          cache-suffix: tests-${{ matrix.suite }}
          cache-dependency-glob: |
            uv.lock
            scripts/data_checks.py

      - name: Install dependencies
        run: uv sync --frozen

      # Without the bundle, test_real_export_serves_smoke_request is skipped.
      - name: Restore champion bundle
        run: make prepare-model

      - name: Run pytest
        shell: bash
        run: uv run pytest tests -m "${{ matrix.marker }}" -q -rs | tee pytest.log

      - name: Write summary
        if: always()
        run: |
          {
            echo "### Tests (${{ matrix.suite }})"
            echo
            echo '```'
            tail -n 1 pytest.log 2>/dev/null || echo "pytest did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  compose-and-smoke:
    name: Compose and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds both images of docker-compose.yml with the GitHub Actions cache. The api scope
      # is shared with publish-image, so the push to GHCR reuses these layers.
      - name: Build images (Buildx cache)
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            mlflow.cache-from=type=gha,scope=mlflow
            mlflow.cache-to=type=gha,scope=mlflow,mode=max

      # Same command as a clean clone, minus --build: the images were built in the step above.
      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Smoke test (/health, /model-info, /predict)
        run: make compose-smoke

      - name: Check the served model
        run: |
          info=$(curl -fsS http://localhost:8000/model-info)
          echo "$info"
          test "$(echo "$info" | jq -r .model_name)" = "mibici-equipo05-p2-riesgo"
          test "$(echo "$info" | jq -r .model_version)" = "3"

      - name: Show container logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  publish-image:
    name: Publish image to GHCR
    needs: [lint-and-security, test-matrix, compose-and-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mibici-p2-api
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Write summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
